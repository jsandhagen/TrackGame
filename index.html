<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f3d34" />
    <title>Ring &amp; Sector • Club Athletics</title>
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="bootStatus" class="boot" role="status">Opening the clubhouse…</div>
    <main id="app">
      <div id="stage">
        <canvas id="world" aria-label="Your club. Drag to look around, tap buildings, stadium parts or athletes." tabindex="0"></canvas>
        <canvas id="stadium" aria-label="Live throwing competition" hidden></canvas>
      </div>
      <header id="hud"></header>
      <div id="tools"></div>
      <section id="window" hidden aria-modal="false" role="region" aria-labelledby="winTitle">
        <header class="win-head"><h2 id="winTitle"></h2><button class="win-close" data-act="close" aria-label="Close"></button></header>
        <div id="panel"></div>
        <div id="quickAction" hidden></div>
      </section>
      <section id="meetbar" hidden></section>
      <nav id="menu" aria-label="Game menu"></nav>
      <dialog id="gameMenu" aria-labelledby="gameMenuTitle"></dialog>
      <div id="toasts" role="status" aria-live="polite"></div>
    </main>
    <dialog id="dialog"></dialog>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>

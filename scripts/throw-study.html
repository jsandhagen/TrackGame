<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Throw movement study · Ring & Sector</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui; background: #172a27; color: #f4ecda; }
  body { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #bfcbbd; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin: 20px 0; }
  button, select { font: inherit; padding: 6px 12px; }
  input[type=range] { flex: 1; min-width: 180px; }
  canvas { width: 100%; image-rendering: pixelated; border: 1px solid #6b7f65; }
  a { color: #efc76a; }
</style>
<h1>Throw movement study</h1>
<p>All four events and form levels. Slow down or scrub to inspect foot contacts, delivery and recovery.</p>
<div class="controls">
  <button id="play" type="button">Pause</button>
  <label>Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5" selected>½×</option><option value="1">1×</option><option value="2">2×</option></select></label>
  <label><input id="foul" type="checkbox"> Foul</label>
  <input id="time" type="range" min="0" max="4000" value="0" aria-label="Throw time">
  <output id="phase"></output>
</div>
<canvas id="study" width="1080" height="640" aria-label="Four rows of animated shot put, discus, hammer and javelin throwers, from novice to elite form"></canvas>
<p>Movement cues and source links: <a href="../docs/THROW_TECHNIQUE.md">throw animation references</a>. Original game sprites; reference athletes guide the mechanics.</p>
<script type="module">
  import { figure, shadow, gripOf } from '../src/render/sprites.js';
  import { throwMotion, throwReleasePoint } from '../src/render/throw-motion.js';
  import { FORMS } from '../src/domain/mastery.js';
  import { ellipse, line } from '../src/render/pixel.js';

  const cv = document.querySelector('#study'), g = cv.getContext('2d'),
    slider = document.querySelector('#time'), play = document.querySelector('#play'),
    speed = document.querySelector('#speed'), foul = document.querySelector('#foul'),
    status = document.querySelector('#phase'),
    events = ['shot', 'discus', 'hammer', 'jav'],
    names = ['Shot put · Storl / Crouser', 'Discus · Perković / Alekna / Ståhl', 'Hammer · Sedykh / Fajdek', 'Javelin · Chopra'];
  let paused = false, elapsed = 0, last = performance.now();
  g.imageSmoothingEnabled = false;
  play.onclick = () => { paused = !paused; play.textContent = paused ? 'Play' : 'Pause'; };
  slider.oninput = () => { elapsed = Number(slider.value); paused = true; play.textContent = 'Play'; draw(elapsed); };
  foul.onchange = () => draw(elapsed);

  function phaseAt(ev, t) {
    const release = ev === 'hammer' || ev === 'jav' ? 100 : 250;
    return t < 400 ? ['ready', t / 400] : t < 2600 ? ['technique', (t - 400) / 2200]
      : t < 2600 + release ? ['release', (t - 2600) / release]
      : ['follow', (t - 2600 - release) / (1400 - release)];
  }
  function draw(t) {
    g.fillStyle = '#172a27'; g.fillRect(0, 0, cv.width, cv.height);
    events.forEach((ev, row) => {
      for (let level = 0; level < 4; level++) {
        const left = level * 270, top = row * 160, ox = left + 164, oy = top + 124,
          [phase, p] = phaseAt(ev, t), m = throwMotion(ev, level, phase, p, { foul: foul.checked }),
          pose = m.run ? 'carry' : 'throw', x = ox + m.dx, y = oy + m.dy;
        g.fillStyle = (row + level) % 2 ? '#293e32' : '#304635';
        g.fillRect(left + 2, top + 2, 266, 156);
        g.fillStyle = '#f4ecda'; g.font = '12px system-ui';
        g.fillText(names[row], left + 12, top + 22);
        g.fillStyle = '#efc76a'; g.fillText(`${level} · ${FORMS[ev][level]}`, left + 12, top + 40);
        if (ev === 'jav') {
          line(g, left + 4, oy + 12, ox + 20, oy - 2, '#b79a73');
          line(g, ox, oy - 8, ox, oy + 8, '#f4ecda', 2);
        } else ellipse(g, ox - 5, oy + 2, 37, 10, '#9da291');
        shadow(g, x, y + 1, 10);
        const [gx, gy] = gripOf({ pose, event: ev, frame: m.frame, flip: m.flip }),
          chain = () => {
            line(g, x + gx * 2, y + gy * 2, x + m.ball.dx, y + m.ball.dy, '#d8d8c8');
            ellipse(g, x + m.ball.dx, y + m.ball.dy, 3, 3, '#929aa1');
          };
        if (m.ball?.behind) chain();
        figure(g, { pose, event: ev, frame: m.frame, flip: m.flip, released: m.released,
          shirt: ['#4d9e86', '#d17b66', '#719bc0', '#ba8cbd'][level], collar: '#efc76a',
          look: { skin: '#d8a47e', hair: '#47352d', style: level } }, x, y, 2);
        if (m.ball && !m.ball.behind) chain();
        if (t >= 2600) {
          const [rx, ry] = throwReleasePoint(ev, level), q = Math.min(1, (t - 2600) / 1400),
            bx = ox + rx + q * 90, by = oy + ry - Math.sin(q * Math.PI) * 25 + q * 36;
          if (ev === 'jav') line(g, bx - 13, by + 3, bx + 13, by - 3, '#efe6c8', 2);
          else ellipse(g, bx, by, 3, ev === 'discus' ? 1 : 3, ev === 'discus' ? '#d8c890' : '#929aa1');
        }
        g.fillStyle = '#bfccbd'; g.fillText(`${phase} · pose ${m.frame}`, left + 12, top + 147);
      }
    });
    status.value = `${(t / 1000).toFixed(2)} s`;
  }
  // Deterministic scrubbing is also useful for browser-based contact sheets.
  window.drawThrowStudy = (t) => { elapsed = t; paused = true; play.textContent = 'Play'; slider.value = t; draw(t); };
  function tick(now) {
    if (!paused) elapsed = (elapsed + (now - last) * Number(speed.value)) % 4000;
    last = now; slider.value = elapsed; draw(elapsed); requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</html>
